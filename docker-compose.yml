services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codesage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-codesage}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-55432}:5432"
    volumes:
      - codesage_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-codesage}"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  codesage_pg_data: