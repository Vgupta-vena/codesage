server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: codesage
  datasource:
    url: jdbc:postgresql://localhost:55432/codesage
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    azure:
      openai:
        endpoint: ${AZURE_OPENAI_ENDPOINT}
        api-key: ${AZURE_OPENAI_API_KEY}
        api-version: ${AZURE_OPENAI_API_VERSION}
        chat:
          options:
            deployment-name: ${AZURE_OPENAI_CHAT_DEPLOYMENT}
        embedding:
          options:
            deployment-name: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT}
    # ---- Vector Store ----
  vectorstore:
    pgvector:
      initialize-schema: ${PGVECTOR_INIT_SCHEMA:true}
      dimensions: ${PGVECTOR_DIM:1536}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.vena.codesage: ${LOG_LEVEL_APP:DEBUG}
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG
codesage:
  ranking:
    exact-qualified-name-match: 300
    exact-simple-name-match: 220
    exact-phrase-match: 110
    lexical-exact-match: 80
    primary-identifier-match: 35
    expanded-identifier-match: 12
    primary-simple-name-match: 65
    expanded-simple-name-match: 20
    summary-match: 18
    touchpoint-match: 20
    endpoint-match: 18
    called-by-match: 12
    all-primary-matched: 70
    all-primary-simple-name-matched: 110
    proximity-match: 35
    real-touchpoint-signal: 20
    real-endpoint-signal: 20
    action-alignment: 40
    object-alignment: 55
    object-drift-penalty: 32
    compound-action-penalty: 44
    identifier-precision-penalty: 5
  ingestion:
    base-dir: ${CODESAGE_DATA_DIR:./data}

